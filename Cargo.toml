[workspace]
resolver = "3"
members = [
    "crates/silon-core",
    "crates/silon-gpui",
    "examples/counter/counter-core",
    "examples/counter/counter-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
silon-core = { path = "crates/silon-core" }
silon-gpui = { path = "crates/silon-gpui" }
counter-core = { path = "examples/counter/counter-core" }

gpui = "0.2.2"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smol = "2"
