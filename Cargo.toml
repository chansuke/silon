[workspace]
resolver = "3"
members = [
    "crates/silon-core",
    "examples/counter/counter-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
silon-core = { path = "crates/silon-core" }
counter-core = { path = "examples/counter/counter-core" }

schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
