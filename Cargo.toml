[workspace]
resolver = "3"
members = [
    "crates/silon-core",
    "crates/silon-introspect",
    "crates/silon-gpui",
    "crates/silon-ui",
    "crates/silon-mcp",
    "examples/counter/counter-core",
    "examples/counter/counter-app",
    "examples/todo/todo-core",
    "examples/todo/todo-app",
    "examples/herdboard/herdboard-core",
    "examples/herdboard/herdboard-app",
    "examples/terminal/terminal-core",
    "examples/terminal/terminal-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "0BSD"
publish = false

# Kani sets `cfg(kani)` when it builds the proof harnesses.
[workspace.lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[workspace.dependencies]
silon-core = { path = "crates/silon-core" }
silon-introspect = { path = "crates/silon-introspect" }
silon-gpui = { path = "crates/silon-gpui" }
silon-ui = { path = "crates/silon-ui" }
counter-core = { path = "examples/counter/counter-core" }
todo-core = { path = "examples/todo/todo-core" }
herdboard-core = { path = "examples/herdboard/herdboard-core" }
terminal-core = { path = "examples/terminal/terminal-core" }

gpui = "0.2.2"
# 0.5.1 is the last release built on crates.io gpui 0.2; 0.6+ uses the gpui-pre fork.
gpui-component = "=0.5.1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures = { version = "0.3", default-features = false, features = ["std"] }
futures-core = { version = "0.3", default-features = false }
futures-channel = { version = "0.3", default-features = false, features = ["std"] }
futures-io = { version = "0.3", default-features = false, features = ["std"] }
tokio = { version = "1", default-features = false }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
smol = "2"
proptest = { version = "1", default-features = false, features = ["std"] }
tower = { version = "0.5", default-features = false }
rmcp = { version = "3.11", default-features = false }
# Plain HTTP to a loopback address: no TLS, no proxy detection.
rustix = { version = "1", features = ["fs", "process", "pty", "termios"] }
# The official libghostty-vt 1.0.1 release; built from source with Zig 0.17
# where no prebuilt library exists (Linux).
ghostty-vt = { version = "=0.9.0", default-features = false }
vt100 = { version = "0.18", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false }
