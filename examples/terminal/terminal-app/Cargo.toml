[package]
name = "terminal-app"
description = "GPUI terminal built with Silon and libghostty-vt"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
## Serves the terminal's state on http://127.0.0.1:3737 for agents.
introspect = ["silon-gpui/introspect", "dep:silon-introspect"]

[dependencies]
futures.workspace = true
ghostty-vt.workspace = true
rustix.workspace = true
gpui.workspace = true
silon-core.workspace = true
silon-gpui.workspace = true
silon-introspect = { workspace = true, optional = true }
silon-ui.workspace = true
terminal-core.workspace = true

[dev-dependencies]
smol.workspace = true
