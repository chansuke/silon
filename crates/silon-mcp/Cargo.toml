[package]
name = "silon-mcp"
description = "MCP server over stdio that forwards to the introspection API of a running Silon app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
reqwest = { workspace = true, features = ["json"] }
rmcp = { workspace = true, features = ["server", "macros", "transport-io"] }
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "io-std"] }

[dev-dependencies]
axum.workspace = true
silon-introspect.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "net", "process", "io-util", "time", "sync"] }
