[graph]
all-features = true

[advisories]
# gpui pulls in crates flagged as unmaintained that Silon cannot replace.
# Report unmaintained crates only when Silon depends on them directly.
unmaintained = "workspace"
ignore = []

[licenses]
# Licenses compatible with distributing Silon under MIT OR Apache-2.0.
# MPL-2.0 is copyleft only at the file level, so it does not extend to
# Silon's own code.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies within this unpublished workspace carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
