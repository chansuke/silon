name: Kani

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  KANI_VERSION: 0.68.0

jobs:
  # All harnesses complete in under a minute total, so running them sequentially
  # in one job avoids paying the Kani install cost once per harness.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Kani is not in nixpkgs, and `cargo kani setup` installs the nightly it
      # needs with rustup, so this job uses the runner's rustup instead of the
      # Nix dev shell. The crates with harnesses need no system libraries.
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version "$KANI_VERSION"
          cargo kani setup
      # A harness that runs past the timeout fails on its own instead of
      # exhausting the runner.
      - name: Check the proof harnesses
        run: |
          set -o pipefail
          : > "$RUNNER_TEMP/kani.log"
          for crate in crates/silon-core examples/counter/counter-core examples/todo/todo-core; do
            echo "::group::$crate"
            (
              cd "$crate"
              cargo kani --output-format terse -Z unstable-options --harness-timeout 5m
            ) 2>&1 | tee -a "$RUNNER_TEMP/kani.log"
            echo "::endgroup::"
          done
      - name: Report the harnesses
        if: ${{ !cancelled() }}
        run: |
          [ -f "$RUNNER_TEMP/kani.log" ] || exit 0
          {
            echo "### Kani"
            echo '```'
            grep -E 'Checking harness|VERIFICATION|cover properties|Verification Time|Complete|Failed' "$RUNNER_TEMP/kani.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Kani passes a harness whose cover properties are unsatisfiable or
      # unreachable. Such a harness checks nothing, so fail it here.
      - name: Check that every harness satisfies its cover properties
        if: success()
        run: |
          awk '
            /^Checking harness / { harness = $3; sub(/\.\.\.$/, "", harness); covered[harness] = 0; seen++ }
            /\*\* [0-9]+ of [0-9]+ cover properties satisfied/ {
              for (i = 1; i <= NF; i++) if ($i == "of") { satisfied = $(i - 1); total = $(i + 1) }
              covered[harness] = 1
              if (satisfied != total) {
                printf "::error::%s: %d of %d cover properties satisfied\n", harness, satisfied, total
                failed = 1
              }
            }
            END {
              if (seen == 0) {
                print "::error::no Kani harnesses were checked"
                exit 1
              }
              for (harness in covered) if (!covered[harness]) {
                printf "::error::%s has no cover property\n", harness
                failed = 1
              }
              exit failed
            }' "$RUNNER_TEMP/kani.log"
