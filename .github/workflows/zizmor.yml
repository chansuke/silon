name: zizmor

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # Audits the workflows for injection, excessive permissions and unpinned
  # actions. Findings fail the job; nothing is uploaded, so the job needs no
  # write permission.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@3dc140bfc76c49fbd4dd958429132e3746bcb086 # v31.11.5
      - name: Audit workflows
        run: nix shell --inputs-from . nixpkgs#zizmor -c zizmor --format=github .
        env:
          # Online audits look up action tags and known vulnerable actions.
          GH_TOKEN: ${{ github.token }}
