name: Change request
description: Suggest a change or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and why Silon makes it hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How you would like it to work. Code sketches are welcome.
